<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spam PR Detector</title> 
</head>
<body>
<div class="container">
    <h2>Spam PR Detector</h2>

    <input type="text" id="title" placeholder = "PR Title"><br>
    <textarea id="body" placeholder="PR Description"></textarea><br>
    <input type="number" id ="additions" placeholder="Additions"><br>
    <input type="number" id ="deletions" placeholder="Deletions"><br>
    <button onclick="checkSpam()">Check</button>

    <div class="result" id="result"></div>
</div>
<script>
    

    async function checkSpam() {
        const resultDiv = document.getElementById("result"); 
        const pr = {
            title: document.getElementById("title").value,
            body: document.getElementById("body").value,
            additions: Number(document.getElementById("additions").value),
            deletions: Number(document.getElementById("deletions").value),
            created_at: new Date().toISOString(),
            merged_at: null

        };
                
        try {
            const response = await fetch("http://localhost:5000/check-spam",{
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ pr })
            });
          
            const data = await response.json();
            
    
            if (data.isSpam){
                resultDiv.innerHTML = "Spam PR Detected";
                resultDiv.className = "result spam";
            }else{
                resultDiv.innerHTML = "Valid PR";
                resultDiv.className = "result not-spam";
            } 
         
        } catch (err) {
            console.error("Fetch Error:", err);
            resultDiv.innerHTML = " Error connecting to server";
        }
    }    
</script>

</body>
</html>
